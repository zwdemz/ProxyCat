version: '3'
services:
  proxycat:
    build: .
    environment:
      - TZ=Asia/Shanghai
      - PROXYCAT_MANAGEMENT_TOKEN=${PROXYCAT_MANAGEMENT_TOKEN:?Set PROXYCAT_MANAGEMENT_TOKEN in .env}
      - PROXYCAT_PROXY_USERNAME=${PROXYCAT_PROXY_USERNAME:?Set PROXYCAT_PROXY_USERNAME in .env}
      - PROXYCAT_PROXY_PASSWORD=${PROXYCAT_PROXY_PASSWORD:?Set PROXYCAT_PROXY_PASSWORD in .env}
    ports:
      - "1080:1080"
      - "5000:5000"
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    network_mode: "bridge"
